# Render Blueprint for the public demo (the "Deploy to Render" button uses this file).
#
# One free web service. Dockerfile.demo bundles a private MongoDB, so there is no
# database to set up; DEMO_MODE seeds sample data on every start, offers one-click
# role logins, and resets the data every 6 hours. Deploys again on every push to main.
#
# For a real staging + production setup with MongoDB Atlas, use
# deploy/render.staging-production.yaml instead.
services:
  - type: web
    name: traackly-demo
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile.demo
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: EXPOSE_DEV_LINKS
        value: "true"
